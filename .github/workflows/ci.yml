name: CI

# Runs the test suite and a production build on every PR to main and on pushes
# to main and the active development branch. Replaces the previously-removed
# boilerplate workflows so the ~114k vitest suite actually guards main.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/cornerstone-platform-build]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The tsc baseline was burned down 1178 → 0 (PRs #711–#718). The build
      # itself keeps ignoreBuildErrors:true (deploys never block on types),
      # so this job is what holds the line at zero for SHIPPED app code.
      #
      # Scope: tsconfig.typecheck.json = tsconfig.json minus *.test.ts / __tests__.
      # Test files are type-validated by actually running them (the Test suite),
      # not by tsc — so the deliberate fab-0 `number|null` widening (which only
      # trips assertions inside tests) doesn't belong in this deploy-code gate.
      # No heap flag: TypeScript 7 (the native port, landed #883) type-checks
      # this project in ~20s within the default heap. Under 5.9.3 the same
      # command needed --max-old-space-size=8192 and took 3-4 minutes, and a
      # bare `tsc` would OOM-crash silently (exit 144) while printing nothing —
      # which is how a 265-error baseline once hid in plain sight.
      - name: tsc --noEmit (app code; baseline locked at 0)
        run: npx tsc --noEmit -p tsconfig.typecheck.json

      # Two scopes tsc could never afford to check under 5.9.3. Both are at zero
      # today and each costs ~25s under TS7, so gate them before they rot.
      #
      # Tests: burning the 460 `number|null` errors the fab-0 widening left in
      # test files took a whole PR (#835), and nothing has held that line since —
      # the step above deliberately excludes them.
      #
      # e2e: excluded from tsconfig.json outright, and the Playwright suite is not
      # a CI job, so until now these files were type-checked by NOTHING. Playwright
      # transpiles specs at run time, which means a renamed export or a rotted
      # helper only surfaced when someone ran the suite by hand.
      #
      # All three scopes are disjoint and were each proven to fail on a planted
      # error before landing, so a green run here means all three really ran.
      - name: tsc --noEmit (tests included; baseline locked at 0)
        run: npx tsc --noEmit -p tsconfig.json

      - name: tsc --noEmit (Playwright e2e; baseline locked at 0)
        run: npx tsc --noEmit -p tsconfig.e2e.json

  guards:
    name: Repo guards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Rebrand guard (no legacy brand terms)
        run: node scripts/check-rebrand.js

      - name: AI-gateway guard (all AI calls via the gateway)
        run: node scripts/check-ai-gateway.js

      - name: Seed-cast guard (no member casts hiding incomplete seeds)
        run: node scripts/check-seed-casts.js

      - name: JSON-body guard (no raw req.json in API routes)
        run: node scripts/check-json-body.js

      - name: RLS guard (no anon-reachable tables or open policies)
        run: node scripts/check-rls.js

      - name: Demo-seed guard (no ungated client-side demo fiction on live tenants)
        run: node scripts/check-demo-seed.js

      - name: Seed-refs guard (every seeded person reference resolves to a roster id)
        run: node scripts/check-seed-refs.js

      - name: DAL-persistence guard (every typed table is backed by a migration)
        run: node scripts/check-dal-persistence.js

      - name: API-contract guard (hook endpoints exist, with matching method + shape)
        run: node scripts/check-api-contracts.js

      - name: Modal-viewport guard (centred panels capped to the viewport and scrollable)
        run: node scripts/check-modal-viewport.js

      - name: Fabricated-score guard (an empty population must not score as compliant)
        run: node scripts/check-fabricated-scores.js

      - name: DAL-adoption guard (routes read/write via dal; 8 structural exclusions pinned)
        run: node scripts/check-dal-adoption.js

      - name: use-client/server guard (no "use client" file imports server-only Supabase code)
        run: node scripts/check-use-client-server.js

      - name: UTC-today guard ("today" is Europe/London, never the UTC day)
        run: node scripts/check-utc-today.js

      - name: Rolling-day-maths guard (day counts are London calendar days, not 24h windows)
        run: node scripts/check-rolling-day-maths.js

      - name: Unguarded-fetch guard (no query/mutation may swallow an HTTP error)
        run: node scripts/check-unguarded-fetch.js

      - name: Seed-decay guard (seed dates float; fixed dates are declared real-world facts)
        run: node scripts/check-seed-decay.js

      - name: Label-association guard (a visible field label is tied to its control)
        run: node scripts/check-label-association.js

      - name: Retrospective-date guard (a record of a past event cannot be future-dated)
        run: node scripts/check-retrospective-dates.js

      - name: Wired-create-dialog guard (a create form submits what the user typed)
        run: node scripts/check-wired-create-dialogs.js

      - name: Dead-button guard (an actionable-looking button does something)
        run: node scripts/check-dead-buttons.js

      - name: Dependency-classification guard (shipped code never imports a devDependency)
        run: node scripts/check-dependency-classification.js

      # tsc reports 0 errors on both shapes this catches — only `next build`
      # does, and it exits at the FIRST prerender crash so it reports one at a
      # time. This runs in ~2s and reports the complete set.
      - name: Hook-ref guard (every useXxx() resolves; no phantom react-query imports)
        run: node scripts/check-hook-refs.js

  test:
    name: Test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests (vitest)
        run: npx vitest run
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Next.js build
        run: npx next build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          # CI has no AI/Supabase secrets — the app must build without them
          # (providers are lazily read at request time; build stays clean).
          NEXT_TELEMETRY_DISABLED: "1"
