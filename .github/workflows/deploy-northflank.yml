name: Deploy to Northflank

# OPTIONAL explicit deploy trigger. In practice Northflank's native git
# integration ("Build on push") is what deploys main — so this workflow is only
# an ADD-ON API trigger, and when its secrets are unset it SKIPS (exits 0 with a
# notice) rather than failing. That keeps main's checks honest: a red here means
# a *configured* trigger genuinely failed, not merely that this repo relies on
# the native integration. (Live deploy health is verified via /api/v1/health-check
# `data.build.commit`, not this check.)
#
# ── To make THIS workflow the trigger instead of native Build-on-push ──
# Set these repo secrets (Settings → Secrets and variables → Actions) AND turn
# OFF the service's native "Build on push" in Northflank (otherwise every push
# builds twice — once via the webhook, once via this API call):
#   NORTHFLANK_API_TOKEN   — a Northflank API token with build/deploy scope
#   NORTHFLANK_PROJECT_ID  — the project id (Northflank → project → Settings)
#   NORTHFLANK_SERVICE_ID  — the combined/build service id

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# One deploy trigger at a time for main; don't cancel an in-flight trigger
# (the API call is quick and we never want to drop a build).
concurrency:
  group: northflank-deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Trigger Northflank build & deploy
    runs-on: ubuntu-latest
    steps:
      - name: Start build for the pushed commit
        env:
          NF_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
          NF_PROJECT: ${{ secrets.NORTHFLANK_PROJECT_ID }}
          NF_SERVICE: ${{ secrets.NORTHFLANK_SERVICE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${NF_TOKEN}" ] || [ -z "${NF_PROJECT}" ] || [ -z "${NF_SERVICE}" ]; then
            echo "::notice::NORTHFLANK_* secrets are not set — skipping the API build trigger."
            echo "Deploys are handled by Northflank's native git integration (Build on push);"
            echo "this workflow only ADDS an explicit API trigger. Set NORTHFLANK_API_TOKEN,"
            echo "NORTHFLANK_PROJECT_ID and NORTHFLANK_SERVICE_ID (and turn OFF Build on push)"
            echo "only if you want this workflow to be the trigger instead. Skipping, not failing."
            exit 0
          fi
          echo "Triggering Northflank build of ${GITHUB_SHA} on main…"
          code=$(curl --silent --show-error --output /tmp/nf-response.json --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer ${NF_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "{\"branch\":\"main\",\"sha\":\"${GITHUB_SHA}\"}" \
            "https://api.northflank.com/v1/projects/${NF_PROJECT}/services/${NF_SERVICE}/build")
          echo "Northflank responded HTTP ${code}:"
          cat /tmp/nf-response.json || true
          echo
          # 2xx = build accepted; anything else fails the workflow.
          case "${code}" in
            2*) echo "Build queued on Northflank." ;;
            *)  echo "::error::Northflank build trigger failed (HTTP ${code})."; exit 1 ;;
          esac
