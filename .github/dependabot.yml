# ══════════════════════════════════════════════════════════════════════════════
# Dependabot — automated dependency maintenance.
#
# Vulnerability alerts + security-update PRs are enabled at the repo level
# (2026-08-08). This file governs the SCHEDULED version-update PRs on top of
# those: weekly, grouped so a bump doesn't mean twenty separate PRs, and with
# the one known-breaking major held back so it can never surprise-open.
# ══════════════════════════════════════════════════════════════════════════════
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # One PR for the low-risk churn; each still gated by the 4 CI checks.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Major bumps land as individual PRs a human reviews — never grouped.
      # @anthropic-ai/sdk in particular: the AI gateway is built on its current
      # API shape, so its major is a deliberate, separately-scoped decision.
      - dependency-name: "@anthropic-ai/sdk"
        update-types: ["version-update:semver-major"]

      # eslint 10 is held, not deferred: it crashes eslint-config-next's
      # bundled eslint-plugin-react (removed context.getFilename), and
      # scripts/check-lint-baseline.js fails the build on it — see held PR
      # #949. It reached main once anyway, on 2026-09-15, by riding in on an
      # unrelated PR whose branch had been rebased onto a base carrying it
      # (#1067 via #1085), and had to be reverted in #1089. Remove this entry
      # only once the upstream fix ships AND the lint baseline guard passes
      # under it.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
